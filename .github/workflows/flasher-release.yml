name: Build TangFPGA Flasher
on:
  workflow_dispatch:
  push:
    tags: ['flasher-v*']
    branches: ['codex/tangfpga-flasher']
    paths: ['flasher/**', '.github/workflows/flasher-release.yml']
  pull_request:
    paths: ['flasher/**', '.github/workflows/flasher-release.yml']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
            python-arch: arm64
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
            python-arch: x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: flasher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: flasher/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.python-arch }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: flasher/src-tauri
      - name: macOS programmer dependencies
        if: runner.os == 'macOS'
        run: brew install libftdi libusb hidapi pkg-config cmake
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-toolchain mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-libusb mingw-w64-ucrt-x86_64-libftdi mingw-w64-ucrt-x86_64-hidapi mingw-w64-ucrt-x86_64-zlib
      - uses: actions/checkout@v4
        with:
          repository: trabucayre/openFPGALoader
          ref: 3c52ab1487ff759e1a3790346455ec7e92ba8c44
          path: .programmer-source
      - name: Build FPGA programmer (Mac)
        if: runner.os == 'macOS'
        run: |
          cmake -S ../.programmer-source -B ../.programmer-build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build ../.programmer-build --parallel 3
          python scripts/stage_programmer.py ../.programmer-build/openFPGALoader --license ../.programmer-source/LICENSE --notices /opt/homebrew/opt/libusb/COPYING --notices /opt/homebrew/opt/libftdi/COPYING.LIB
      - name: Build FPGA programmer (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -S ../.programmer-source -B ../.programmer-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build ../.programmer-build --parallel 3
      - name: Stage FPGA programmer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\ucrt64\bin;" + $env:PATH
          python scripts/stage_programmer.py ../.programmer-build/openFPGALoader.exe --license ../.programmer-source/LICENSE
      - name: Include programmer corresponding source
        run: python -c "import pathlib,subprocess; subprocess.run(['git','-C','../.programmer-source','archive','--format=tar.gz','-o',str(pathlib.Path('src-tauri/resources/programmer/openFPGALoader-source.tar.gz').resolve()),'HEAD'],check=True)"
      - name: Stage native BL616 helper
        run: |
          python -m pip install -r scripts/requirements-bl616.txt
          python scripts/stage_bl616.py
      - name: Validate firmware update helper
        run: python -m unittest discover -s scripts/bl616 -v
      - run: npm ci
      - run: npm run check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features desktop
      - name: Build installer
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Verify Windows payload
        if: runner.os == 'Windows'
        run: python scripts/verify_windows_installer.py
      - name: Collect release files and checksums
        run: python scripts/collect_release.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: TangFPGA-Flasher-${{ matrix.target }}
          path: flasher/artifacts/release/*
          if-no-files-found: error
