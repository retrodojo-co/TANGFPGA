[package]
name = "tangfpga-flasher"
version = "0.2.0"
edition = "2021"
license = "MIT"

[lib]
name = "tangfpga_flasher"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "tangfpga-flasher"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = []
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusb = { version = "0.9", features = ["vendored"] }
plist = "1"
zip = { version = "4", default-features = false, features = ["deflate"] }
sysinfo = "0.33"
tauri = { version = "2", optional = true , features = [] }
tauri-plugin-dialog = { version = "2", optional = true }

[dev-dependencies]
tempfile = "3"
